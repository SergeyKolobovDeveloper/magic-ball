<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
    <!-- Основне тіло кулі -->
    <circle cx="32" cy="32" r="30" fill="#0f0f1a" />
    
    <!-- Градієнтний відблиск (3D ефект) -->
    <radialGradient id="grad" cx="35%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#4a4a5a" stop-opacity="0.8" />
        <stop offset="60%" stop-color="#0f0f1a" stop-opacity="1" />
        <stop offset="100%" stop-color="#000000" stop-opacity="1" />
    </radialGradient>
    <circle cx="32" cy="32" r="30" fill="url(#grad)" />
    
    <!-- Внутрішнє віконце -->
    <circle cx="32" cy="32" r="14" fill="#05050a" stroke="#1a1a2e" stroke-width="1.5" />
    
    <!-- Цифра 8 -->
    <text x="32" y="38" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
</svg>
